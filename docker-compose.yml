# Compose V2 不需要 version 字段(已废弃,填了反而警告)

services:
  backend:
    build: ./backend
    container_name: interviewrag-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - SKIP_RERANKER=1
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - SQLITE_DB_PATH=/app/data/interview.db
      - RAW_DATA_DIR=/app/data/raw
      - PROCESSED_DATA_DIR=/app/data/processed
    volumes:
      - interviewrag_data:/app/data
    healthcheck:
      # /api/ping 不调 LLM（避免智谱 API 重试 3 次把 healthcheck 卡到 30s+）
      test: ["CMD", "curl", "-f", "--max-time", "3", "http://localhost:8080/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: interviewrag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  interviewrag_data:
